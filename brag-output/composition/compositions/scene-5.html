      <style>

          font-family: "Plus Jakarta Sans", sans-serif;

            linear-gradient(170deg, #120a22, #241a44 70%);

        #s5-root .glow {

          background: radial-gradient(circle, rgba(255, 77, 141, 0.45), transparent 70%);
          pointer-events: none;

          opacity: 0.85;
        }
        #s5-root .stage {
          position: relative;
          z-index: 1;
          width: 100%;

          display: flex;
          flex-direction: column;

        #s5-root .marquee-wordmark {
          display: flex;
          align-items: baseline;

          gap: 26px;

        #s5-root .marquee-word {

        #s5-root .marquee-word span {

          text-shadow: 0 0 28px rgba(242, 193, 78, 0.55), 0 0 64px rgba(255, 77, 141, 0.3);
        }
        #s5-root .tagline {
          margin-top: 24px;
          font-weight: 500;
          font-size: 34px;
          color: rgba(246, 241, 255, 0.78);
          text-align: center;
        }
      </style>

      <div data-hf-id="hf-017c" id="s5-root" data-composition-id="scene-5" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ltbp" class="glow" id="s5-glow"></div>
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-ltxh" class="marquee-wordmark" id="s5-wordmark" style="opacity: 0">
            <div data-hf-id="hf-vnjl" class="marquee-word"><span data-hf-id="hf-hm6v">L</span><span data-hf-id="hf-ms68">A</span></div>
            <div data-hf-id="hf-ofl1" class="marquee-word"><span data-hf-id="hf-g0yr">P</span><span data-hf-id="hf-l6y4">E</span><span data-hf-id="hf-f8cp">R</span><span data-hf-id="hf-cs5z">L</span><span data-hf-id="hf-r7dk">A</span></div>
            <div data-hf-id="hf-pmi4" class="marquee-word"><span data-hf-id="hf-fmnq">S</span><span data-hf-id="hf-h7vu">O</span><span data-hf-id="hf-k011">F</span><span data-hf-id="hf-efqn">T</span></div>
          </div>
          <div data-hf-id="hf-m4lh" class="tagline" id="s5-tagline" style="opacity: 0">Pedidos. Caja. Inventario. Todo en vivo.</div>
        </div>
      </div>

      <script src="../assets/music/audio-data.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });

        // scene starts at global 19.656 — the wordmark re-ignites already fully lit, no flicker
        tl.fromTo(
          "#s5-wordmark",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          "#s5-tagline",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.444,
        );

        // beat-locked: 3.274 (scene-local) = global 22.93, the strongest cue in the whole track
        tl.fromTo(
          "#s5-wordmark",
          { filter: "brightness(1)" },
          { filter: "brightness(1.6)", duration: 0.28, ease: "power2.out" },
          2.994,
        ).to("#s5-wordmark", { filter: "brightness(1.15)", duration: 0.2, ease: "power1.out" }, 3.274);

        // subtle audio-reactive glow — bass band breathes the marquee halo
        // GLOBAL_OFFSET: this scene starts at t=19.656 in the full track
        const s5GlowEl = document.getElementById("s5-glow");
        const S5_GLOBAL_OFFSET = 19.656;
        const s5Frames = Math.round(3.344 * 30);
        for (let f = 0; f < s5Frames; f++) {
          const t = f / 30;
          const globalFrame = Math.round((t + S5_GLOBAL_OFFSET) * 30);
          const bass = AUDIO_DATA.frames[globalFrame] ? AUDIO_DATA.frames[globalFrame].bands[0] : 0;
          tl.call(
            () => {
              s5GlowEl.style.transform = `scale(${(1 + (bass - 0.5) * 0.1).toFixed(4)})`;
              s5GlowEl.style.opacity = (0.78 + bass * 0.2).toFixed(3);
            },
            [],
            t,
          );
        }

        window.__timelines["scene-5"] = tl;
      </script>
    </template>
